<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Пойдёшь со мной на свидание?</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root { --pink:#ff4f8b; --pink2:#ff8fb3; --bg1:#ffe3ec; --bg2:#ffd0e0; --text:#5a1e33; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { margin:0; min-height:100%; overflow-x:hidden; }
  html { height:100%; }
  body {
    font-family:'Comfortaa',system-ui,sans-serif; color:var(--text);
    background:radial-gradient(circle at 30% 20%,var(--bg1),var(--bg2)) fixed;
    display:flex; padding:16px 0; min-height:100vh; min-height:100dvh;
    touch-action:manipulation; user-select:none; -webkit-user-select:none;
  }
  .hearts { position:fixed; inset:0; pointer-events:none; overflow:hidden; z-index:0; }
  .hearts span { position:absolute; bottom:-40px; font-size:24px; opacity:.6; animation:up linear infinite; }
  @keyframes up { to { transform:translateY(-115vh) rotate(25deg); opacity:0; } }

  .card {
    position:relative; z-index:1; width:min(92vw,460px); margin:auto;
    background:rgba(255,255,255,.85); backdrop-filter:blur(6px);
    border-radius:28px; padding:32px 24px 36px; text-align:center;
    box-shadow:0 20px 50px rgba(255,79,139,.25);
  }
  .emoji { font-size:72px; line-height:1; margin-bottom:12px; animation:beat 1.2s infinite; display:inline-block; }
  @keyframes beat { 0%,100%{transform:scale(1)} 15%{transform:scale(1.15)} 30%{transform:scale(1)} 45%{transform:scale(1.1)} }
  h1 { font-size:clamp(22px,6vw,30px); margin:0 0 8px; }
  p.sub { margin:0 0 26px; font-size:15px; opacity:.8; min-height:20px; }
  .btns { display:flex; gap:14px; justify-content:center; align-items:center; flex-wrap:wrap; min-height:70px; }
  button {
    font-family:inherit; font-weight:700; border:0; cursor:pointer;
    border-radius:999px; padding:14px 30px; font-size:18px;
    transition:transform .25s, font-size .25s, padding .25s;
  }
  #yes { background:linear-gradient(135deg,var(--pink),var(--pink2)); color:#fff; box-shadow:0 8px 20px rgba(255,79,139,.4); }
  #yes:active { transform:scale(.96); }
  #no { background:#fff; color:var(--text); border:2px solid #f3b6c9; touch-action:none; }
  #no.flying { position:fixed; z-index:5; transition:left .22s ease, top .22s ease; }

  .screen { display:none; }
  .screen.active { display:block; animation:fade .4s; }
  @keyframes fade { from{opacity:0; transform:translateY(10px)} to{opacity:1; transform:none} }

  .options { display:grid; grid-template-columns:1fr 1fr; gap:10px; margin:18px 0 6px; }
  .opt {
    background:#fff; border:2px solid #f6c6d6; border-radius:18px; padding:14px 8px;
    font-size:15px; font-weight:700; color:var(--text);
  }
  .opt .e { display:block; font-size:30px; margin-bottom:4px; }
  .opt.sel { border-color:var(--pink); background:#fff0f5; }
  .when { display:grid; grid-template-columns:1fr 1fr; gap:10px; text-align:left; }
  .when label { font-size:13px; font-weight:700; display:flex; flex-direction:column; gap:6px; }
  .when input, .when select {
    font-family:inherit; font-size:16px; color:var(--text); background:#fff;
    border:2px solid #f6c6d6; border-radius:14px; padding:11px 10px; width:100%;
    -webkit-appearance:none; appearance:none; min-height:48px;
  }
  .when input:focus, .when select:focus { outline:none; border-color:var(--pink); }
  p.err { color:#d6336c; margin:10px 0 0; min-height:18px; font-size:14px; }
  #done { margin-top:10px; width:100%; background:linear-gradient(135deg,var(--pink),var(--pink2)); color:#fff; box-shadow:0 8px 20px rgba(255,79,139,.4); }
  .confetti { position:fixed; top:-20px; width:10px; height:14px; z-index:10; pointer-events:none; animation:fall linear forwards; }
  @keyframes fall { to { transform:translateY(110vh) rotate(720deg); } }
</style>
</head>
<body>
<div class="hearts" id="hearts"></div>

<div class="card">
  <!-- Экран 1: вопрос -->
  <div class="screen active" id="s1">
    <div class="emoji">💌</div>
    <h1 id="question">Солнышко, пойдёшь со мной на свидание?</h1>
    <p class="sub" id="hint">Отвечай честно 🙂</p>
    <div class="btns">
      <button id="yes">Да</button>
      <button id="no">Нет</button>
    </div>
  </div>

  <!-- Экран 2: куда идём -->
  <div class="screen" id="s2">
    <div class="emoji">🥰</div>
    <h1>Ура! Я знал! ☀️</h1>
    <p class="sub">Выбери, куда пойдём:</p>
    <div class="options">
      <button class="opt"><span class="e">☕</span>Кофе и десерт</button>
      <button class="opt"><span class="e">🎬</span>Кино</button>
      <button class="opt"><span class="e">🍝</span>Ресторан</button>
      <button class="opt"><span class="e">⛸️</span>Каток</button>
      <button class="opt"><span class="e">🎳</span>Боулинг</button>
      <button class="opt"><span class="e">💨</span>Кальянная</button>
    </div>
    <p class="sub" style="margin:18px 0 10px">Когда тебе удобно?</p>
    <div class="when">
      <label>Дата<input type="date" id="date"></label>
      <label>Время<select id="time"></select></label>
    </div>
    <p class="sub err" id="err"></p>
    <button id="done">Готово 💘</button>
  </div>

  <!-- Экран 3: финал -->
  <div class="screen" id="s3">
    <div class="emoji">💖</div>
    <h1>Договорились!</h1>
    <p class="sub" id="final"></p>
    <p class="sub" style="margin-top:-12px">Сделай скриншот и отправь мне 😉</p>
  </div>
</div>

<script>
  // Плавающие сердечки
  const hearts = document.getElementById('hearts');
  const hs = ['💖','💕','💗','💘','❤️'];
  for (let i = 0; i < 18; i++) {
    const s = document.createElement('span');
    s.textContent = hs[i % hs.length];
    s.style.left = Math.random() * 100 + 'vw';
    s.style.fontSize = 16 + Math.random() * 22 + 'px';
    s.style.animationDuration = 7 + Math.random() * 8 + 's';
    s.style.animationDelay = -Math.random() * 12 + 's';
    hearts.appendChild(s);
  }

  const yes = document.getElementById('yes');
  const no = document.getElementById('no');
  const hint = document.getElementById('hint');
  const phrases = [
    'Точно нет? 🥺', 'Подумай ещё!', 'Не-а, не поймаешь 😜', 'Ну пожааалуйста',
    'Кнопка «Нет» в отпуске 🏖', 'Я буду грустить 😢', 'Последний шанс!',
    'Ладно, «Нет» сломалась', 'Только «Да» работает 💘'
  ];
  let tries = 0;

  function runAway(e) {
    if (e) { e.preventDefault(); e.stopPropagation(); }
    tries++;
    const r = no.getBoundingClientRect();
    if (!no.classList.contains('flying')) {
      // Переносим кнопку прямо в body, чтобы она летала по всему экрану, а не внутри карточки
      document.body.appendChild(no);
      no.style.left = r.left + 'px';
      no.style.top = r.top + 'px';
      no.classList.add('flying');
      void no.offsetWidth;
    }
    const pad = 12;
    const maxX = window.innerWidth - r.width - pad;
    const maxY = window.innerHeight - r.height - pad;
    let x, y, guard = 0;
    // Уводим кнопку подальше от текущего места (и от пальца)
    do {
      x = pad + Math.random() * (maxX - pad);
      y = pad + Math.random() * (maxY - pad);
      guard++;
    } while (Math.hypot(x - r.left, y - r.top) < Math.min(window.innerWidth, window.innerHeight) * 0.35 && guard < 30);
    no.style.left = x + 'px';
    no.style.top = y + 'px';

    hint.textContent = phrases[(tries - 1) % phrases.length];
    const scale = Math.min(1 + tries * 0.12, 2.2);
    yes.style.transform = 'scale(' + scale + ')';
    if (tries >= 6) no.textContent = ['Нет?', 'Не-а', 'Ой'][tries % 3];
  }

  // Мышь: убегает при наведении. Телефон: при касании — до того, как сработает клик.
  no.addEventListener('mouseenter', runAway);
  no.addEventListener('pointerdown', runAway);
  no.addEventListener('touchstart', runAway, { passive: false });
  no.addEventListener('click', runAway);

  // На компьютере убегает, даже когда курсор просто подбирается близко
  document.addEventListener('mousemove', (e) => {
    if (!document.getElementById('s1').classList.contains('active')) return;
    const r = no.getBoundingClientRect();
    const cx = r.left + r.width / 2, cy = r.top + r.height / 2;
    if (Math.hypot(e.clientX - cx, e.clientY - cy) < 70) runAway();
  });

  function show(id) {
    document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
    document.getElementById(id).classList.add('active');
  }

  function confetti() {
    const colors = ['#ff4f8b', '#ffb3c8', '#ffd166', '#8ecae6', '#c77dff'];
    for (let i = 0; i < 90; i++) {
      const c = document.createElement('div');
      c.className = 'confetti';
      c.style.left = Math.random() * 100 + 'vw';
      c.style.background = colors[i % colors.length];
      c.style.animationDuration = 2 + Math.random() * 2.5 + 's';
      c.style.animationDelay = Math.random() * 0.6 + 's';
      document.body.appendChild(c);
      setTimeout(() => c.remove(), 5500);
    }
  }

  yes.addEventListener('click', () => {
    no.style.display = 'none';
    confetti();
    show('s2');
  });

  // Дата: не раньше сегодняшнего дня
  const dateEl = document.getElementById('date');
  const pad2 = n => String(n).padStart(2, '0');
  const t = new Date();
  dateEl.min = t.getFullYear() + '-' + pad2(t.getMonth() + 1) + '-' + pad2(t.getDate());

  // Время: с 10:00 до 23:00 каждые 30 минут
  const timeEl = document.getElementById('time');
  timeEl.innerHTML = '<option value="">—:—</option>';
  for (let h = 10; h <= 23; h++) {
    for (const m of ['00', '30']) {
      if (h === 23 && m === '30') continue;
      const v = pad2(h) + ':' + m;
      timeEl.insertAdjacentHTML('beforeend', '<option value="' + v + '">' + v + '</option>');
    }
  }

  let place = '';
  document.querySelectorAll('.opt').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.opt').forEach(b => b.classList.remove('sel'));
      btn.classList.add('sel');
      place = btn.textContent.trim();
      document.getElementById('err').textContent = '';
    });
  });

  const months = ['января','февраля','марта','апреля','мая','июня','июля','августа','сентября','октября','ноября','декабря'];
  const days = ['воскресенье','понедельник','вторник','среду','четверг','пятницу','субботу'];

  document.getElementById('done').addEventListener('click', () => {
    const err = document.getElementById('err');
    if (!place) { err.textContent = 'Выбери, куда пойдём 🙂'; return; }
    if (!dateEl.value) { err.textContent = 'Выбери дату 📅'; return; }
    if (!timeEl.value) { err.textContent = 'Выбери время ⏰'; return; }
    const [y, mo, d] = dateEl.value.split('-').map(Number);
    const dt = new Date(y, mo - 1, d);
    const when = (dt.getDay() === 2 ? 'во ' : 'в ') + days[dt.getDay()] + ', ' + d + ' ' + months[mo - 1] + ' в ' + timeEl.value;
    document.getElementById('final').textContent = 'Идём: ' + place + ', ' + when + '. Жду с нетерпением!';
    confetti();
    show('s3');
  });

  window.addEventListener('resize', () => {
    if (no.classList.contains('flying')) {
      const r = no.getBoundingClientRect();
      no.style.left = Math.min(r.left, window.innerWidth - r.width - 12) + 'px';
      no.style.top = Math.min(r.top, window.innerHeight - r.height - 12) + 'px';
    }
  });
</script>
</body>
</html>
